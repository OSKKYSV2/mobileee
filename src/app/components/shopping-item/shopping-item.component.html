<ion-item [class.bought]="item().bought">
  <ion-button
    slot="start"
    fill="clear"
    [color]="item().bought ? 'success' : 'medium'"
    [attr.aria-label]="item().bought ? 'Označit jako nekoupené' : 'Označit jako koupené'"
    (click)="toggle()"
  >
    <ion-icon slot="icon-only" [name]="item().bought ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
  </ion-button>

  @if (photoUrl(); as url) {
    <div slot="start" class="photo">
      <ion-img [src]="url" [alt]="item().name"></ion-img>
    </div>
  }

  <ion-label>
    <h2 class="name">{{ item().name }}</h2>
    @if (item().photoFile && photoUrl() === '') {
      <p>Fotka je uložená v jiném telefonu.</p>
    }
  </ion-label>

  <div slot="end" class="quantity">
    <ion-button
      fill="clear"
      size="small"
      aria-label="Snížit množství"
      [disabled]="item().quantity <= 1 || item().bought"
      (click)="decrease()"
    >
      −
    </ion-button>
    <span class="quantity-value">{{ item().quantity }}×</span>
    <ion-button fill="clear" size="small" aria-label="Zvýšit množství" [disabled]="item().bought" (click)="increase()">
      +
    </ion-button>
  </div>

  <ion-button slot="end" fill="clear" color="danger" aria-label="Odstranit položku" (click)="removed.emit()">
    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
  </ion-button>
</ion-item>
