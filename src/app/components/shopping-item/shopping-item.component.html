<div class="row" [class.bought]="item().bought">
  <button
    type="button"
    class="check"
    [attr.aria-label]="item().bought ? 'Označit jako nekoupené' : 'Označit jako koupené'"
    [attr.aria-pressed]="item().bought"
    (click)="toggle()"
  >
    @if (item().bought) {
      <ion-icon name="checkmark" aria-hidden="true"></ion-icon>
    }
  </button>

  @if (photoUrl(); as url) {
    <div class="photo">
      <ion-img [src]="url" [alt]="item().name"></ion-img>
    </div>
  }

  <div class="text">
    <span class="name">{{ item().name }}</span>
    @if (item().photoFile && photoUrl() === '') {
      <span class="note">📷 fotka je v jiném telefonu</span>
    }
  </div>

  <div class="stepper" [class.hidden]="item().bought">
    <button
      type="button"
      aria-label="Snížit množství"
      [disabled]="item().quantity <= 1 || item().bought"
      (click)="decrease()"
    >
      −
    </button>
    <span class="quantity">{{ item().quantity }}</span>
    <button type="button" aria-label="Zvýšit množství" [disabled]="item().bought" (click)="increase()">+</button>
  </div>
  @if (item().bought) {
    <span class="quantity-done">{{ item().quantity }}×</span>
  }

  <button type="button" class="delete" aria-label="Odstranit položku" (click)="removed.emit()">
    <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
  </button>
</div>
